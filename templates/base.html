<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus{% endblock %}</title>
</head>
<body style="background-color: #18202a; color: white; margin: 0%; padding: 0;">
    <div style="display: flex; height: 100vh;">
        <div style="background-color:  #0f172a  ; width: 250px; overflow-y: auto;">
            <p  style="font-size: 2rem; margin-top: 1rem; margin-bottom: 0;"><b>Channels</b></p>
            <form action="/receiver" method="post" style="width: 100%; margin-bottom: 0; text-align: left;">
            <p style="margin-top: 1.5rem; margin-bottom: 0.3rem;"><button name="receiver" value="1/Agents" style="display: block; text-decoration: none; color: white; background-color: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 1.5rem; text-align: left;">Agents</button></p>

            {% for user in users %}
            <p style="margin-top: 0; margin-bottom: 0.3rem;"><button name="receiver" value="{{user[0]}}/{{user[1]}}" style="display: block; text-decoration: none; color: white; background-color: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 1.5rem; text-align: left;"># {{user[1]}} </button></p>
            {% endfor %}
            </form>

            <p style="margin-top: 0; font-size: 1.5rem; font-weight: bold;"><a href="/tasks" style="display: block; text-decoration: none; color: white; background-color: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-weight: bold;">Tasks</a></p>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
