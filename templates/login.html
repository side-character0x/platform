<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body style="margin: 0; padding: 0; height: 100vh; width: 100%; background-color: #0b1120; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffffff;">

    <div style="width: 440px; min-height: 480px; background-color: #1c2432; border: 1px solid #2e3848; border-radius: 12px; padding: 40px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;">
        <h1 style="font-weight: bold; font-size: 2rem; text-align: center; margin-bottom: 0; margin-top: 2px; color: #38bdf8;"><u>NEXUS</u></h1>
        <p style="font-size: 2.5rem; font-weight: bold; text-align: center; margin-bottom: 0;">Welcome Back</p>
        <p style="font-size: 1.5rem; text-align: center; margin-top: 0;margin-bottom: 2rem; color: #94a3b8;">Log in to your NEXUS workspace</p>
        <form action="/login" method="post" style="width: 100%;">
            {% if error %}
            <p style="color: red; font-size: 1rem; text-align: center;">Either <b>USERNAME</b> or <b>PASSWORD</b> is incorrect.</p>
            {% endif %}
            <p style="justify-content: center; text-align: center; margin-bottom: 0.5rem;">
            <input type="text" name="username" placeholder="Username" required
                style="width: 85%; padding: 12px 14px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </p>
            <p style="justify-content: center; text-align: center; margin-top: 2px;">
            <input type="text" name="password" placeholder="Password" required
                style="width: 85%; padding: 12px 14px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </p>
            <p style="text-align: center; margin-top: 1rem;">
            <button type="submit"
                style="width: 85%; padding: 14px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; box-sizing: border-box;">
                Log In
            </button>
            </p>
            <p style="text-align: center;">New to NEXES? <a href="/signup" style=" color: #38bdf8;">Create an account</a></p>
        </form>
    </div>

</body>
